<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Monitoring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
        rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">IoT Panel</h2>

    <nav>
      <a href="/" class="menu">📊 Dashboard</a>
      <a href="monitoring.html" class="menu active">📈 Monitoring</a>
      <a href="#" class="menu disabled">⚙ Settings</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <header class="top-header">
      <div>
        <h1>Monitoring Data</h1>
        <p class="subtitle">Filter data per jam & export CSV</p>
      </div>
    </header>

    <main class="container">

      <!-- FILTER -->
      <div class="filter-bar">

        <label>
          From:
          <input type="datetime-local" id="from">
        </label>

        <label>
          To:
          <input type="datetime-local" id="to">
        </label>

        <button id="applyFilter">Apply</button>
        <button id="downloadCSV">Download CSV</button>

      </div>

      <!-- RESULT -->
      <table class="monitoring-table">
        <thead>
          <tr>
            <th>Location</th>
            <th>Sensor</th>
            <th>Hour</th>
            <th>Average</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>

    </main>

  </div>

</div>

<script src="monitoring.js"></script>
</body>
</html>
